
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<title>VYBE OS — Your Digital Universe</title>
<style>
:root{
  --bg:#090b16;--panel:#111426;--panel2:#171a30;--line:#292d49;
  --text:#f4f4ff;--muted:#969bbd;--purple:#9b78ff;--cyan:#55e7ff;
  --pink:#ff76c8;--green:#67f5b0;--radius:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.bg-orb{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(120px);opacity:.13;pointer-events:none;z-index:-1}
.orb1{background:#743dff;top:-160px;left:15%}.orb2{background:#00c8ff;right:-180px;top:35%}.orb3{background:#ff3ca8;bottom:-250px;left:35%}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;flex-shrink:0;border-right:1px solid var(--line);background:rgba(11,13,27,.88);padding:25px 15px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#7d5cff,#39e6ff);font-size:23px;font-weight:900;color:#fff;box-shadow:0 0 25px #7255ff55}
.brand-name{font-size:20px;font-weight:900;letter-spacing:3px}.brand-sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}
.nav-label{font-size:10px;font-weight:800;letter-spacing:2px;color:#747a9f;padding:0 12px;margin-bottom:8px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;transition:.2s}
.nav button:hover,.nav button.active{color:white;background:linear-gradient(100deg,#8e65ff25,#44dfff0c);border-color:#8171ff35}
.nav button.active{box-shadow:inset 3px 0 var(--purple)}
.nav-icon{width:23px;text-align:center;font-size:17px}
.nav-count{margin-left:auto;color:var(--cyan);font-size:12px}
.sidebar-bottom{margin-top:auto;border:1px solid var(--line);border-radius:16px;padding:15px;background:linear-gradient(145deg,#171a30,#101221)}
.sidebar-bottom p{font-size:12px;color:var(--muted);line-height:1.6}
.main{flex:1;min-width:0;padding:27px clamp(16px,3vw,42px) 45px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:35px}
.breadcrumb{font-size:12px;color:var(--muted)}.breadcrumb b{color:var(--text)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn,.secondary,.primary,.danger{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 13px;transition:.2s}
.icon-btn:hover,.secondary:hover{border-color:var(--purple);transform:translateY(-1px)}
.primary{background:linear-gradient(110deg,#8057ff,#4b92ff);border:0;font-weight:750;box-shadow:0 5px 22px #7855ff28}
.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.danger{color:#ff9db0;border-color:#ff6d8b44}.danger:hover{background:#ff4b7114}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:2.7px;font-weight:800;margin-bottom:10px}
h1{font-size:clamp(29px,4vw,46px);letter-spacing:-1.6px;margin:0 0 9px;font-weight:850}
h2{font-size:21px;margin:0 0 12px}h3{font-size:15px;margin:0 0 7px}
.subtext{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
.hero{position:relative;overflow:hidden;border:1px solid #7661ff38;border-radius:25px;padding:27px;background:linear-gradient(115deg,#1a1637,#101c31 65%,#111629);margin-bottom:22px}
.hero:after{content:"✦";position:absolute;right:7%;top:-36px;font-size:180px;color:#8d7cff12;transform:rotate(15deg);pointer-events:none}
.hero-content{position:relative;z-index:1;max-width:700px}
.hero h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.7px}
.hero p{max-width:600px;color:#c0c4e0;line-height:1.8;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:24px}
.stat,.panel{background:linear-gradient(145deg,#15182b,#101221);border:1px solid var(--line);border-radius:18px;padding:18px}
.stat-label{font-size:12px;color:var(--muted)}.stat-number{font-size:27px;font-weight:850;margin:10px 0 4px}.stat-foot{font-size:11px;color:var(--cyan)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap input{width:100%;padding:12px 14px 12px 39px}
.search-symbol{position:absolute;left:13px;top:12px;color:var(--muted)}
input,textarea,select{background:#0d1020;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px;line-height:1.6}
label{display:block;font-size:12px;color:#b8bddb;margin:13px 0 7px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:8px 12px;font-size:12px}
.filter.active,.filter:hover{background:#8b6aff1c;color:#fff;border-color:#8e75ff77}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.app-card{position:relative;overflow:hidden;text-align:left;background:linear-gradient(145deg,#171a30,#101221);border:1px solid #2a2e4b;border-radius:18px;padding:17px 15px;min-height:165px;color:var(--text);transition:transform .23s,border-color .23s,box-shadow .23s;animation:rise .4s both}
.app-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 5%,var(--glow,#9b78ff)20,transparent 52%);opacity:.12;pointer-events:none}
.app-card:hover{transform:translateY(-5px);border-color:var(--glow,#9b78ff);box-shadow:0 10px 32px #0004,0 0 20px color-mix(in srgb,var(--glow,#9b78ff) 13%,transparent)}
.app-card>*{position:relative}
.app-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;margin-bottom:15px;background:linear-gradient(135deg,color-mix(in srgb,var(--glow,#9b78ff) 28%,#15182b),#101426);border:1px solid color-mix(in srgb,var(--glow,#9b78ff) 40%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--glow,#9b78ff) 12%,transparent)}
.app-title{font-size:14px;font-weight:800;margin-bottom:6px}
.app-desc{font-size:11px;line-height:1.6;color:var(--muted)}
.app-status{display:inline-block;font-size:9px;color:var(--cyan);letter-spacing:.5px;margin-top:12px;text-transform:uppercase}
.app-status.soon{color:#e5b7ff}
.remove-app{position:absolute!important;right:9px;top:8px;z-index:3;background:#272039;border:1px solid #5d426d;color:#ffb9d2;border-radius:8px;width:26px;height:26px;padding:0;display:grid;place-items:center}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}
.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.list{display:flex;flex-direction:column;gap:9px}
.list-item{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:13px;background:#121426}
.list-item .item-body{flex:1;min-width:0}.list-item p{color:var(--muted);font-size:12px;line-height:1.5;margin:5px 0 0}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.inline-form>*{flex:1}
.check{width:17px;height:17px;accent-color:#9b78ff;margin-top:3px}
.item-title.done{text-decoration:line-through;color:var(--muted)}
.note-card{padding:15px;border:1px solid var(--line);border-radius:15px;background:#14172a;min-width:0;overflow-wrap:anywhere}
.note-card p{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap}
.note-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.note-actions button{padding:7px 9px;font-size:11px}
.note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.project-card{padding:17px;border:1px solid var(--line);border-radius:16px;background:#14172a}
.progress{height:6px;background:#292d46;border-radius:99px;overflow:hidden;margin:13px 0}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:99px}
.muted{color:var(--muted)}.small{font-size:11px}.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.planner-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day-col{min-height:135px;background:#121426;border:1px solid var(--line);border-radius:13px;padding:9px}
.day-col strong{font-size:11px}.day-col .day-num{font-size:10px;color:var(--muted);margin-top:4px}
.day-task{margin-top:9px;padding:7px;background:#805bff20;border-left:2px solid var(--purple);border-radius:5px;font-size:10px;overflow-wrap:anywhere}
.timer{text-align:center;padding:30px 15px}
.timer-number{font-size:clamp(56px,10vw,90px);font-weight:850;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.timer-ring{width:min(280px,80%);aspect-ratio:1;border:5px solid #292b48;border-top-color:var(--purple);border-right-color:var(--cyan);border-radius:50%;display:grid;place-items:center;margin:15px auto 24px;box-shadow:0 0 45px #7e65ff16}
.timer-ring.running{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-backdrop{position:fixed;inset:0;background:#03040bd9;backdrop-filter:blur(8px);z-index:20;display:none;align-items:center;justify-content:center;padding:15px}
.modal-backdrop.show{display:flex}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;border:1px solid #45436e;border-radius:22px;background:#111426;box-shadow:0 20px 100px #000a;padding:23px;animation:rise .2s both}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:17px}
.modal-head h2{margin:5px 0}.modal-body{line-height:1.6}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.color-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}
.swatch{height:70px;border-radius:12px;border:1px solid #ffffff20;cursor:pointer;display:flex;align-items:flex-end;padding:7px;font-size:10px;text-shadow:0 1px 3px #000}
.preview-frame{width:100%;height:250px;border:1px solid var(--line);border-radius:12px;background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;padding:12px 18px;background:#202641;border:1px solid #55537d;border-radius:12px;transition:.25s;font-size:13px;box-shadow:0 10px 40px #0006}
.toast.show{opacity:1;transform:translate(-50%,0)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
kbd{background:#262941;border:1px solid #424661;border-radius:5px;padding:2px 6px;color:#c8c9e7}
footer{font-size:10px;color:#686e91;text-align:center;padding:30px 0 5px;letter-spacing:1px}
.light{--bg:#f1f2fc;--panel:#fff;--panel2:#e7e9f8;--line:#d8d9ec;--text:#181a32;--muted:#666b89}
.light .sidebar{background:#f8f8ff}.light .hero{background:linear-gradient(115deg,#e8e1ff,#dff6ff)}.light .hero p{color:#484c6a}
.light .stat,.light .panel,.light .app-card,.light .note-card,.light .project-card,.light .list-item,.light .day-col{background:#fff}
.light input,.light textarea,.light select{background:#f7f7ff;color:#181a32}
.light .modal{background:#f8f8ff}
@media(max-width:1100px){.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.note-grid,.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.planner-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:720px){.app{display:block}.sidebar{width:auto;position:sticky;top:0;z-index:10;padding:10px;background:#0b0d1bf2;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px}.brand-mark{width:35px;height:35px}.brand-name{font-size:16px}.sidebar .nav-label,.sidebar-bottom{display:none}.nav{flex-direction:row;overflow:auto;margin-top:10px}.nav button{white-space:nowrap;width:auto;flex-shrink:0;padding:9px 11px;font-size:12px}.nav-icon{width:auto}.main{padding:19px 14px 30px}.topbar{margin-bottom:23px}.page-head{align-items:flex-start}.app-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.app-card{padding:13px;min-height:153px}.app-icon{width:42px;height:42px;margin-bottom:12px}.two-col{grid-template-columns:1fr}.note-grid,.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.planner-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.top-actions .hide-mobile{display:none}}
@media(max-width:390px){.note-grid,.project-grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat-number{font-size:23px}}
</style>
</head>

<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">V</div><div><div class="brand-name">VYBE</div><div class="brand-sub">YOUR DIGITAL UNIVERSE</div></div></div>

<script>
(() => {
"use strict";
const STORE_KEY = "vybe_os_workspace_v3";
const OLD_KEYS = ["vybeOS","vybe_os","vybe-os-data","vybe_workspace","vybeOSData"];
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const dateLabel = d => {if(!d)return "No date";const x=new Date(d+"T12:00:00");return isNaN(x)?"No date":x.toLocaleDateString(undefined,{month:"short",day:"numeric"});};

const builtins = [
 ["tasks","☑","Tasks","Plan your next move","Productivity","#8e75ff","working"],
 ["notes","✎","Notes","Capture your ideas","Productivity","#58dfff","working"],
 ["projects","◫","Projects","Track your progress","Productivity","#ff83c8","working"],
 ["planner","▦","Planner","Map your week","Productivity","#60e6bc","working"],
 ["focus","◷","Focus room","Protect your attention","Productivity","#a58aff","working"],
 ["quick","✧","Quick capture","Save a new thought","Productivity","#ff9d70","working"],
 ["calendar","▦","Calendar","View dated tasks","Productivity","#64c8ff","working"],
 ["habits","✦","Habit tracker","Build daily consistency","Productivity","#72edac","soon"],
 ["goals","◎","Goals","Keep your targets visible","Productivity","#ffbd72","soon"],
 ["journal","▤","Journal","Reflect on your day","Productivity","#ff84bc","soon"],
 ["reminders","♧","Reminders","Remember important things","Productivity","#a88bff","soon"],
 ["checklist","☷","Checklist","Make a simple list","Productivity","#56d9e8","working"],
 ["writer","✍","Writing pad","Write and copy text","Creative","#ff8dca","working"],
 ["markdown","M","Markdown preview","Preview basic Markdown","Creative","#9f91ff","working"],
 ["colors","◉","Color palette","Explore color swatches","Creative","#ff8cbb","working"],
 ["colorpicker","▧","Color picker","Choose and copy a color","Creative","#ffb66b","working"],
 ["idea","✧","Idea board","Save creative thoughts","Creative","#d28cff","soon"],
 ["draw","✎","Drawing board","Sketch and annotate","Creative","#6ddfff","soon"],
 ["snippets","{ }","Snippet library","Keep reusable code","Creative","#78e5c1","soon"],
 ["expenses","₹","Expense tracker","Track spending entries","Finance","#72e5bd","soon"],
 ["budget","▥","Budget planner","Plan monthly budgets","Finance","#8c9dff","soon"],
 ["subscriptions","↻","Subscriptions","Track recurring payments","Finance","#f9b66e","soon"],
 ["calculator","＋","Calculator","Calculate expressions","Tools","#6be5f5","working"],
 ["converter","⇄","Unit converter","Convert common units","Tools","#a78bff","working"],
 ["stopwatch","◴","Stopwatch","Time an activity","Tools","#ff8fc9","working"],
 ["countdown","⌛","Countdown","Count down to a date","Tools","#7fe9be","working"],
 ["json","{ }","JSON formatter","Format and validate JSON","Developer","#ffb46c","working"],
 ["html","</>","HTML preview","Preview your HTML safely","Developer","#6dd9ff","working"],
 ["regex",".*","Regex tester","Test a regular expression","Developer","#b49aff","soon"],
 ["base64","⇅","Base64 tool","Encode and decode text","Developer","#76e6c0","working"],
 ["code","⌘","Code editor","Write small code snippets","Developer","#65d7ff","working"],
 ["flashcards","▣","Flashcards","Practice active recall","Study","#d68bff","soon"],
 ["study","▤","Study planner","Organize study sessions","Study","#6ce7d0","soon"],
 ["revision","↻","Revision tracker","Track revision progress","Study","#ffb86b","soon"],
 ["reading","▤","Reading list","Keep a list of books","Study","#81a9ff","soon"],
 ["grades","∑","Grade calculator","Estimate your score","Study","#ff91c9","working"]
];
const defaultState = () => ({
 version:3, workspace:"My Workspace",theme:"dark",tasks:[],notes:[],projects:[],
 focusMinutes:0,focusSessions:0,customApps:[],quickCaptures:[],checklist:[],
 snippets:[],timerSeconds:25*60,createdAt:new Date().toISOString()
});
let state;
let currentPage="overview", currentFilter="All", appSearch="", timerId=null, remaining=25*60, timerRunning=false;
let toastId;
function normalize(raw){
 const d=defaultState();
 if(!raw || typeof raw!=="object")return d;
 const arrKeys=["tasks","notes","projects","customApps","quickCaptures","checklist","snippets"];
 for(const k of arrKeys)if(Array.isArray(raw[k]))d[k]=raw[k];
 for(const k of ["workspace","theme","focusMinutes","focusSessions","timerSeconds","createdAt"])if(raw[k]!==undefined)d[k]=raw[k];
 d.workspace=String(d.workspace||"My Workspace").slice(0,70);
 d.theme=d.theme==="light"?"light":"dark";
 d.focusMinutes=Math.max(0,Number(d.focusMinutes)||0);
 d.focusSessions=Math.max(0,Number(d.focusSessions)||0);
 d.tasks=d.tasks.map(t=>({id:t.id||uid(),title:String(t.title||"Untitled task"),done:!!t.done,due:t.due||"",created:t.created||Date.now()}));
 d.notes=d.notes.map(n=>({id:n.id||uid(),title:String(n.title||"Untitled note"),body:String(n.body||""),updated:n.updated||Date.now()}));
 d.projects=d.projects.map(p=>({id:p.id||uid(),title:String(p.title||"Untitled project"),description:String(p.description||""),progress:Math.min(100,Math.max(0,Number(p.progress)||0))}));
 d.customApps=d.customApps.map(a=>({...a,id:a.id||uid(),name:String(a.name||"Custom app"),description:String(a.description||""),url:String(a.url||""),category:String(a.category||"Custom"),icon:String(a.icon||"✦"),color:String(a.color||"#9b78ff")}));
 d.quickCaptures=d.quickCaptures.map(x=>({...x,id:x.id||uid(),text:String(x.text||"")}));
 d.checklist=d.checklist.map(x=>({...x,id:x.id||uid(),text:String(x.text||""),done:!!x.done}));
 d.snippets=d.snippets.map(x=>({...x,id:x.id||uid(),title:String(x.title||"Snippet"),body:String(x.body||"")}));
 return d;
}
function loadState(){
 try{
  const saved=localStorage.getItem(STORE_KEY);
  if(saved)return normalize(JSON.parse(saved));
  for(const key of OLD_KEYS){
   const old=localStorage.getItem(key);
   if(old){try{const migrated=normalize(JSON.parse(old));localStorage.setItem(STORE_KEY,JSON.stringify(migrated));return migrated}catch(e){}}
  }
 }catch(e){console.warn("VYBE storage could not be read",e)}
 return defaultState();
}
state=loadState();
function saveState(){
 try{
  localStorage.setItem(STORE_KEY,JSON.stringify(state));
  updateCounts();
  return true;
 }catch(e){
  showToast("Save failed: browser storage may be full. Export a backup.");
  return false;
 }
}
function updateCounts(){
 $("#navTasks").textContent=state.tasks.filter(t=>!t.done).length;
 $("#navNotes").textContent=state.notes.length;
}
function showToast(msg){
 const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastId);
 toastId=setTimeout(()=>t.classList.remove("show"),2600);
}

 $("#breadcrumb").textContent=labels[p]||"App";
 render();

document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));

function appCard(a,custom=false){

 return `<button class="app-card" style="--glow:${esc(a.color||"#9b78ff")}" data-app="${esc(a.id)}">

function render(){
 setTheme();updateCounts();

function renderNotes(){

 <div class="panel" style="margin-top:18px"><h2>Undated tasks</h2><div class="list">${state.tasks.filter(t=>!t.due&&!t.done).map(taskRow).join("")||`<p class="subtext">No open undated tasks.</p>`}</div></div>`;

 <div class="settings-grid"><div class="panel"><h2>Workspace</h2><label>Workspace name</label><input id="workspaceName" maxlength="70" value="${esc(state.workspace)}"><div class="toolbar"><button class="primary" data-action="save-workspace">Save name</button></div><p class="subtext">Your workspace name is stored locally.</p></div>
 <div class="panel"><h2>Appearance</h2><p class="subtext">Choose your preferred theme.</p><div class="toolbar"><button class="secondary" data-action="theme-dark">☾ Dark mode</button><button class="secondary" data-action="theme-light">☼ Light mode</button></div></div>

 <div class="panel"><h2>About VYBE OS</h2><p class="subtext">A single-file personal workspace prototype. No account, server, or cloud backup is included.</p><div class="small muted">Version 3 · Browser edition</div></div></div>`;

function bindPageEvents(){
 const root=$("#page");
 root.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.go)));
 root.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action)));
 root.querySelectorAll("[data-toggle-task]").forEach(el=>el.addEventListener("change",()=>{const t=state.tasks.find(x=>x.id===el.dataset.toggleTask);if(t)t.done=el.checked;saveState();render();}));
 root.querySelectorAll("[data-delete-task]").forEach(b=>b.addEventListener("click",()=>{state.tasks=state.tasks.filter(t=>t.id!==b.dataset.deleteTask);saveState();render();showToast("Task deleted")}));
 root.querySelectorAll("[data-edit-note]").forEach(b=>b.addEventListener("click",()=>editNote(b.dataset.editNote)));
 root.querySelectorAll("[data-delete-note]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this note?")){state.notes=state.notes.filter(n=>n.id!==b.dataset.deleteNote);saveState();render();showToast("Note deleted")}}));
 root.querySelectorAll("[data-delete-project]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this project?")){state.projects=state.projects.filter(p=>p.id!==b.dataset.deleteProject);saveState();render()}}));
 root.querySelectorAll("[data-project-progress]").forEach(el=>el.addEventListener("input",()=>{const p=state.projects.find(x=>x.id===el.dataset.projectProgress);if(p){p.progress=Number(el.value);saveState();const label=el.closest(".project-card").querySelector(".row-between strong");if(label)label.textContent=p.progress+"%";const bar=el.closest(".project-card").querySelector(".progress span");if(bar)bar.style.width=p.progress+"%";}}));
 const tf=$("#taskForm");if(tf)tf.addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(tf);const title=String(fd.get("title")||"").trim();if(!title)return;state.tasks.unshift({id:uid(),title,due:String(fd.get("due")||""),done:false,created:Date.now()});saveState();render();showToast("Task saved")});
 const ns=$("#noteSearch");if(ns)ns.addEventListener("input",()=>{const q=ns.value.toLowerCase();$("#noteGrid").innerHTML=noteCards(state.notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q)));bindNoteCardEvents();});
 const as=$("#appSearch");if(as)as.addEventListener("input",()=>{appSearch=as.value;const pos=as.selectionStart;const grid=$("#appGrid");const all=[...builtins.map(a=>({...a,title:a.name,status:a.status})),...state.customApps.map(a=>({...a,title:a.name,status:a.url?"working":"soon",custom:true}))];const shown=all.filter(a=>(currentFilter==="All"||a.category===currentFilter)&&(`${a.name} ${a.description} ${a.category}`).toLowerCase().includes(appSearch.toLowerCase()));grid.innerHTML=shown.length?shown.map(a=>appCard(a,!!a.custom)).join(""):`<div class="empty">No apps match your search.</div>`;bindAppCards();});
 root.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{currentFilter=b.dataset.filter;render()}));
 bindAppCards();
 const toggle=$("#timerToggle");if(toggle)toggle.addEventListener("click",toggleTimer);
 const reset=$("#timerReset");if(reset)reset.addEventListener("click",()=>resetTimer(25*60));
 const short=$("#timerShort");if(short)short.addEventListener("click",()=>resetTimer(15*60));
 const long=$("#timerLong");if(long)long.addEventListener("click",()=>resetTimer(25*60));
 bindNoteCardEvents();
}
function bindNoteCardEvents(){
 $("#page").querySelectorAll("[data-edit-note]").forEach(b=>{if(b.dataset.bound)return;b.dataset.bound="1";b.addEventListener("click",()=>editNote(b.dataset.editNote))});
 $("#page").querySelectorAll("[data-delete-note]").forEach(b=>{if(b.dataset.bound)return;b.dataset.bound="1";b.addEventListener("click",()=>{if(confirm("Delete this note?")){state.notes=state.notes.filter(n=>n.id!==b.dataset.deleteNote);saveState();render();showToast("Note deleted")}})});
}
function bindAppCards(){
 $("#page").querySelectorAll("[data-app]").forEach(b=>{if(b.dataset.bound)return;b.dataset.bound="1";b.addEventListener("click",()=>openApp(b.dataset.app))});
}
function action(a){
 if(a==="add-task"){setPage("tasks");setTimeout(()=>$("#taskForm input[name=title]")?.focus(),50)}
 if(a==="add-note")editNote(null);
 if(a==="add-project")editProject(null);
 if(a==="add-app")addAppModal();
 if(a==="export")exportBackup();
 if(a==="import")$("#importFile").click();
 if(a==="save-workspace"){const v=$("#workspaceName").value.trim();if(v){state.workspace=v;saveState();render();showToast("Workspace name saved")}}
 if(a==="theme-dark"||a==="theme-light"){state.theme=a==="theme-light"?"light":"dark";saveState();setTheme();render()}
 if(a==="clear-data")clearData();
}
function editNote(id){
 const n=state.notes.find(x=>x.id===id);
 openModal(n?"Edit note":"Create a note",`<form id="noteForm"><label>Title</label><input name="title" required maxlength="120" placeholder="A thought worth keeping" value="${esc(n?.title||"")}"><label>Note</label><textarea name="body" rows="8" placeholder="Write your ideas here...">${esc(n?.body||"")}</textarea><div class="modal-actions"><button class="primary">Save note</button><button type="button" class="secondary" id="cancelModal">Cancel</button></div></form>`);
 $("#cancelModal").onclick=closeModal;
 $("#noteForm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const title=String(fd.get("title")||"").trim();if(!title)return;const item={id:n?.id||uid(),title,body:String(fd.get("body")||""),updated:Date.now()};if(n)state.notes=state.notes.map(x=>x.id===n.id?item:x);else state.notes.unshift(item);saveState();closeModal();render();showToast("Note saved")};
}
function editProject(id){

 openModal(p?"Edit project":"Create a project",`<form id="projectForm"><label>Project name</label><input name="title" required maxlength="120" value="${esc(p?.title||"")}"><label>Description</label><textarea name="description" rows="3">${esc(p?.description||"")}</textarea><label>Progress (%)</label><input type="number" name="progress" min="0" max="100" value="${p?.progress||0}"><div class="modal-actions"><button class="primary">Save project</button></div></form>`);
 $("#projectForm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const item={id:p?.id||uid(),title:String(fd.get("title")).trim(),description:String(fd.get("description")||""),progress:Math.min(100,Math.max(0,Number(fd.get("progress"))||0))};if(p)state.projects=state.projects.map(x=>x.id===p.id?item:x);else state.projects.unshift(item);saveState();closeModal();render();showToast("Project saved")};
}
function addAppModal(){
 openModal("Add an app","<p class='subtext'>Create a personal launcher card. A website URL makes it an external shortcut; a card without a URL is saved as a custom placeholder.</p><form id='customAppForm'><div class='form-grid'><div><label>App name</label><input name='name' required maxlength='50' placeholder='e.g. My study website'></div><div><label>Category</label><select name='category'><option>Custom</option><option>Productivity</option><option>Creative</option><option>Finance</option><option>Tools</option><option>Developer</option><option>Study</option></select></div></div><label>Description</label><input name='description' maxlength='100' placeholder='What is this app for?'><div class='form-grid'><div><label>Icon (emoji or symbol)</label><input name='icon' maxlength='4' value='✦'></div><div><label>Accent color</label><input name='color' type='color' value='#9b78ff' style='height:42px;padding:4px'></div></div><label>Website URL (optional)</label><input name='url' type='url' placeholder='https://example.com'><div class='modal-actions'><button class='primary'>＋ Save app</button><button type='button' class='secondary' id='cancelApp'>Cancel</button></div></form>");
 $("#cancelApp").onclick=closeModal;
 $("#customAppForm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const url=String(fd.get("url")||"").trim();if(url){try{const u=new URL(url);if(!["http:","https:"].includes(u.protocol))throw new Error();}catch(err){showToast("Enter a valid http or https URL");return}}
 state.customApps.unshift({id:uid(),name:String(fd.get("name")).trim(),category:String(fd.get("category")),description:String(fd.get("description")||"").trim()||"Personal shortcut",icon:String(fd.get("icon")||"✦"),color:String(fd.get("color")||"#9b78ff"),url});
 saveState();closeModal();currentPage="launcher";render();showToast("App added to your launcher")};
}
function openApp(id){
 const custom=state.customApps.find(a=>a.id===id);
 if(custom){
  if(custom.url){openModal(custom.name,`<p class="subtext">This shortcut opens an external website in a new tab.</p><p style="overflow-wrap:anywhere">${esc(custom.url)}</p><div class="modal-actions"><button class="primary" id="openExternal">Open website ↗</button><button class="danger" id="deleteCustom">Remove app</button></div>`);$("#openExternal").onclick=()=>window.open(custom.url,"_blank","noopener,noreferrer");$("#deleteCustom").onclick=()=>{if(confirm("Remove this custom app?")){state.customApps=state.customApps.filter(a=>a.id!==id);saveState();closeModal();render();showToast("App removed")}}}
  else{openModal(custom.name,`<p class="subtext">This is a custom launcher card, not a built-in mini-app.</p><div class="modal-actions"><button class="danger" id="deleteCustom">Remove app</button></div>`);$("#deleteCustom").onclick=()=>{state.customApps=state.customApps.filter(a=>a.id!==id);saveState();closeModal();render()}}
  return;
 }
 const a=builtins.find(x=>x.id===id);if(!a)return;
 if(a.status==="soon"){openModal(a.name,`<p class="subtext">This app is listed in the VYBE universe, but its full functionality has not been implemented yet.</p><p><span class="app-status soon">COMING SOON</span></p>`);return}
 const launch={
 tasks:()=>{closeModal();setPage("tasks")},
 notes:()=>editNote(null),
 projects:()=>{closeModal();setPage("projects")},
 planner:()=>{closeModal();setPage("planner")},
 focus:()=>{closeModal();setPage("focus")},
 quick:()=>quickCapture(),
 calendar:()=>{closeModal();setPage("planner")},
 checklist:()=>checklistApp(),
 writer:()=>writerApp(),
 markdown:()=>markdownApp(),
 colors:()=>colorsApp(),
 colorpicker:()=>colorPickerApp(),
 calculator:()=>calculatorApp(),
 converter:()=>converterApp(),
 stopwatch:()=>stopwatchApp(),
 countdown:()=>countdownApp(),
 json:()=>jsonApp(),
 html:()=>htmlApp(),
 base64:()=>base64App(),
 code:()=>codeApp(),
 grades:()=>gradesApp()
 };
 (launch[id]||(()=>openModal(a.name,"<p class='subtext'>This app is not implemented yet.</p>")))();
}
function quickCapture(){
 openModal("Quick capture","<form id='quickForm'><label>Capture a thought</label><textarea name='text' required maxlength='2000' placeholder='Type anything you want to remember...'></textarea><div class='modal-actions'><button class='primary'>Save thought</button></div></form><div id='quickList' class='list' style='margin-top:15px'></div>");
 const draw=()=>{$("#quickList").innerHTML=state.quickCaptures.length?state.quickCaptures.slice(0,15).map(q=>`<div class="list-item"><div class="item-body">${esc(q.text)}<p>${new Date(q.created||Date.now()).toLocaleString()}</p></div><button class="icon-btn" data-qdel="${q.id}">×</button></div>`).join(""):"<p class='subtext'>No quick captures yet.</p>";$("#quickList").querySelectorAll("[data-qdel]").forEach(b=>b.onclick=()=>{state.quickCaptures=state.quickCaptures.filter(q=>q.id!==b.dataset.qdel);saveState();draw()})};
 $("#quickForm").onsubmit=e=>{e.preventDefault();const text=String(new FormData(e.currentTarget).get("text")||"").trim();if(!text)return;state.quickCaptures.unshift({id:uid(),text,created:Date.now()});saveState();e.currentTarget.reset();draw();showToast("Thought saved")};draw();
}
function checklistApp(){
 openModal("Checklist","<form id='checkForm' class='inline-form'><input name='text' placeholder='Add a checklist item' required maxlength='180'><button class='primary'>Add</button></form><div class='list' id='checkItems'></div>");
 const draw=()=>{$("#checkItems").innerHTML=state.checklist.length?state.checklist.map(x=>`<div class="list-item"><input type="checkbox" class="check" data-check="${x.id}" ${x.done?"checked":""}><div class="item-body"><span class="${x.done?"item-title done":""}">${esc(x.text)}</span></div><button class="icon-btn" data-checkdel="${x.id}">×</button></div>`).join(""):"<p class='subtext'>Your list is empty.</p>";$("#checkItems").querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{const x=state.checklist.find(i=>i.id===el.dataset.check);if(x)x.done=el.checked;saveState();draw()});$("#checkItems").querySelectorAll("[data-checkdel]").forEach(el=>el.onclick=()=>{state.checklist=state.checklist.filter(i=>i.id!==el.dataset.checkdel);saveState();draw()})};
 $("#checkForm").onsubmit=e=>{e.preventDefault();const text=String(new FormData(e.currentTarget).get("text")||"").trim();if(text){state.checklist.unshift({id:uid(),text,done:false});saveState();e.currentTarget.reset();draw()}};draw();
}
function writerApp(){
 openModal("Writing pad","<label>Write your text</label><textarea id='writerText' rows='10' placeholder='Start writing...'></textarea><div class='modal-actions'><button class='primary' id='copyWriter'>Copy text</button><button class='secondary' id='downloadWriter'>Download .txt</button><span class='small muted' id='writerCount'>0 characters</span></div>");
 $("#writerText").oninput=()=>$("#writerCount").textContent=$("#writerText").value.length+" characters";
 $("#copyWriter").onclick=()=>copyText($("#writerText").value);
 $("#downloadWriter").onclick=()=>downloadText("vybe-writing.txt",$("#writerText").value,"text/plain");
}
function markdownApp(){
 openModal("Markdown preview","<p class='subtext'>Basic preview for headings, bold, italic, bullets and paragraphs. This is a small preview, not a complete Markdown engine.</p><label>Markdown</label><textarea id='mdInput' rows='7' placeholder='# My heading&#10;Write **bold** text here'></textarea><label>Preview</label><div class='panel' id='mdPreview' style='min-height:100px;overflow-wrap:anywhere'></div>");
 const md=()=>{$("#mdPreview").innerHTML=basicMarkdown($("#mdInput").value)};$("#mdInput").oninput=md;md();
}
function basicMarkdown(s){
 return esc(s).split(/\n/).map(line=>{if(line.startsWith("### "))return "<h3>"+inlineMd(line.slice(4))+"</h3>";if(line.startsWith("## "))return "<h2>"+inlineMd(line.slice(3))+"</h2>";if(line.startsWith("# "))return "<h2>"+inlineMd(line.slice(2))+"</h2>";if(line.startsWith("- "))return "• "+inlineMd(line.slice(2));return line?`<p>${inlineMd(line)}</p>`:""}).join("");
}
function inlineMd(s){return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code>$1</code>")}
function colorsApp(){
 const colors=["#9B78FF","#55E7FF","#FF76C8","#67F5B0","#FFB86B","#F472B6","#60A5FA","#F87171","#C084FC","#34D399","#FBBF24","#818CF8","#FB7185","#2DD4BF","#A3E635","#E879F9"];
 openModal("Color palette","<p class='subtext'>Tap any swatch to copy its hex code.</p><div class='color-swatches'>"+colors.map(c=>`<button class="swatch" style="background:${c}" data-color="${c}">${c}</button>`).join("")+"</div>");
 $("#modalBody").querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>copyText(b.dataset.color));
}
function colorPickerApp(){
 openModal("Color picker","<label>Choose a color</label><input type='color' id='pickColor' value='#9b78ff' style='height:75px;padding:5px'><label>Hex value</label><input id='hexValue' value='#9b78ff' readonly><div class='modal-actions'><button class='primary' id='copyHex'>Copy hex</button></div>");
 $("#pickColor").oninput=()=>$("#hexValue").value=$("#pickColor").value;$("#copyHex").onclick=()=>copyText($("#hexValue").value);
}
function calculatorApp(){
 openModal("Calculator","<label>Expression</label><input id='calcExpr' placeholder='e.g. (12 + 8) * 3' autocomplete='off'><div class='modal-actions'><button class='primary' id='calculate'>Calculate</button></div><label>Result</label><input id='calcResult' readonly placeholder='Your result'><p class='small muted'>Supports basic arithmetic, brackets, decimals and percentages as division by 100. No variables or code execution.</p>");
 $("#calculate").onclick=()=>{const expr=$("#calcExpr").value.trim();if(!expr||!/^[0-9+\-*/().%\s]+$/.test(expr)){showToast("Use numbers and basic arithmetic only");return}try{const safe=expr.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");const result=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(result))throw new Error();$("#calcResult").value=String(Number(result.toFixed(10)))}catch(e){$("#calcResult").value="Invalid expression"}};
 $("#calcExpr").addEventListener("keydown",e=>{if(e.key==="Enter")$("#calculate").click()});
}
function converterApp(){
 openModal("Unit converter","<label>Conversion type</label><select id='convType'><option value='kmmi'>Kilometres ↔ miles</option><option value='mft'>Metres ↔ feet</option><option value='cmIn'>Centimetres ↔ inches</option><option value='kgLb'>Kilograms ↔ pounds</option><option value='cF'>Celsius ↔ Fahrenheit</option><option value='lGal'>Litres ↔ US gallons</option></select><label>Value</label><input type='number' id='convValue' value='1' step='any'><label>Direction</label><select id='convDir'><option value='0'>First unit → second unit</option><option value='1'>Second unit → first unit</option></select><label>Result</label><input id='convResult' readonly><p class='small muted'>Uses standard approximate conversion factors.</p>");
 const factors={kmmi:[1.609344,"km","mi"],mft:[0.3048,"m","ft"],cmIn:[2.54,"cm","in"],kgLb:[2.2046226218,"kg","lb"],lGal:[3.785411784,"L","US gal"]};
 const convert=()=>{const type=$("#convType").value,v=Number($("#convValue").value),dir=Number($("#convDir").value);if(!Number.isFinite(v))return;let result;if(type==="cF")result=dir===0?v*9/5+32:(v-32)*5/9;else{const f=factors[type][0];result=dir===0?v/f:v*f}$("#convResult").value=Number(result.toFixed(6))};
 ["convType","convValue","convDir"].forEach(id=>$("#"+id).addEventListener("input",convert));convert();
}
function stopwatchApp(){
 openModal("Stopwatch","<div class='timer'><div class='timer-number' id='swTime'>00:00.0</div><div class='modal-actions' style='justify-content:center'><button class='primary' id='swToggle'>Start</button><button class='secondary' id='swReset'>Reset</button></div></div>");
 let start=0,elapsed=0,interval=null;
 const paint=()=>{const t=elapsed+(interval?performance.now()-start:0);const tenths=Math.floor(t/100);$("#swTime").textContent=String(Math.floor(t/60000)).padStart(2,"0")+":"+String(Math.floor(t/1000)%60).padStart(2,"0")+"."+tenths%10};
 $("#swToggle").onclick=()=>{if(interval){elapsed+=performance.now()-start;clearInterval(interval);interval=null;$("#swToggle").textContent="Resume"}else{start=performance.now();interval=setInterval(paint,100);$("#swToggle").textContent="Pause"}paint()};
 $("#swReset").onclick=()=>{clearInterval(interval);interval=null;elapsed=0;$("#swToggle").textContent="Start";paint()};
}
function countdownApp(){
 openModal("Countdown","<label>Target date and time</label><input type='datetime-local' id='countTarget'><div class='modal-actions'><button class='primary' id='countStart'>Start countdown</button></div><div class='timer-number' id='countResult' style='font-size:35px;margin-top:20px'>—</div>");
 let iv=null;$("#countStart").onclick=()=>{clearInterval(iv);const target=new Date($("#countTarget").value).getTime();if(!Number.isFinite(target)){showToast("Choose a valid date and time");return}const draw=()=>{const diff=target-Date.now();if(diff<=0){$("#countResult").textContent="Time's up!";clearInterval(iv);return}const d=Math.floor(diff/86400000),h=Math.floor(diff/3600000)%24,m=Math.floor(diff/60000)%60,s=Math.floor(diff/1000)%60;$("#countResult").textContent=`${d}d ${h}h ${m}m ${s}s`};draw();iv=setInterval(draw,1000)};
}
function jsonApp(){
 openModal("JSON formatter","<label>JSON input</label><textarea id='jsonInput' rows='8' placeholder='{\"hello\":\"world\"}'></textarea><div class='modal-actions'><button class='primary' id='jsonFormat'>Format</button><button class='secondary' id='jsonMinify'>Minify</button><button class='secondary' id='jsonCopy'>Copy result</button></div><label>Result</label><textarea id='jsonOutput' rows='8' readonly></textarea><p class='small muted' id='jsonStatus'></p>");
 const run=pretty=>{try{const parsed=JSON.parse($("#jsonInput").value);$("#jsonOutput").value=JSON.stringify(parsed,null,pretty?2:0);$("#jsonStatus").textContent="Valid JSON";$("#jsonStatus").style.color="var(--green)"}catch(e){$("#jsonStatus").textContent="Invalid JSON: "+e.message;$("#jsonStatus").style.color="#ff8ba8"}};
 $("#jsonFormat").onclick=()=>run(true);$("#jsonMinify").onclick=()=>run(false);$("#jsonCopy").onclick=()=>copyText($("#jsonOutput").value);
}
function htmlApp(){
 openModal("HTML preview","<p class='subtext'>Preview HTML you write. Scripts are removed before the preview is displayed.</p><label>HTML</label><textarea id='htmlInput' rows='8' placeholder='<h1>Hello VYBE</h1><p>Your page here.</p>'></textarea><div class='modal-actions'><button class='primary' id='htmlRender'>Render preview</button></div><label>Preview</label><iframe class='preview-frame' id='htmlFrame' sandbox='' title='HTML preview'></iframe>");
 $("#htmlRender").onclick=()=>{const source=$("#htmlInput").value.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi,"").replace(/\son\w+\s*=\s*(['"]).*?\1/gi,"");$("#htmlFrame").srcdoc=source};
}
function base64App(){
 openModal("Base64 tool","<label>Text</label><textarea id='b64Input' rows='5' placeholder='Enter text or Base64...'></textarea><div class='modal-actions'><button class='primary' id='b64Encode'>Encode</button><button class='secondary' id='b64Decode'>Decode</button><button class='secondary' id='b64Copy'>Copy output</button></div><label>Output</label><textarea id='b64Output' rows='5' readonly></textarea>");
 $("#b64Encode").onclick=()=>{try{$("#b64Output").value=btoa(unescape(encodeURIComponent($("#b64Input").value)))}catch(e){showToast("Could not encode text")}};
 $("#b64Decode").onclick=()=>{try{$("#b64Output").value=decodeURIComponent(escape(atob($("#b64Input").value.trim())))}catch(e){showToast("Invalid Base64 input")}};
 $("#b64Copy").onclick=()=>copyText($("#b64Output").value);
}
function codeApp(){
 openModal("Code editor","<p class='subtext'>A basic local text editor for snippets. It does not execute code or provide a full IDE.</p><label>Snippet name</label><input id='snippetTitle' placeholder='My snippet'><label>Code</label><textarea id='snippetBody' rows='8' placeholder='Write code here...'></textarea><div class='modal-actions'><button class='primary' id='snippetSave'>Save snippet</button><button class='secondary' id='snippetCopy'>Copy code</button></div><div class='list' id='snippetList' style='margin-top:16px'></div>");
 const draw=()=>{$("#snippetList").innerHTML=state.snippets.length?state.snippets.map(s=>`<div class="list-item"><div class="item-body"><strong>${esc(s.title)}</strong><p>${esc(s.body.slice(0,100))}</p></div><button class="secondary" data-snippet="${s.id}">Load</button><button class="icon-btn" data-snippetdel="${s.id}">×</button></div>`).join(""):"<p class='subtext'>No saved snippets.</p>";$("#snippetList").querySelectorAll("[data-snippet]").forEach(b=>b.onclick=()=>{const s=state.snippets.find(x=>x.id===b.dataset.snippet);if(s){$("#snippetTitle").value=s.title;$("#snippetBody").value=s.body}});$("#snippetList").querySelectorAll("[data-snippetdel]").forEach(b=>b.onclick=()=>{state.snippets=state.snippets.filter(x=>x.id!==b.dataset.snippetdel);saveState();draw()})};
 $("#snippetSave").onclick=()=>{const title=$("#snippetTitle").value.trim()||"Untitled snippet",body=$("#snippetBody").value;state.snippets.unshift({id:uid(),title,body});saveState();draw();showToast("Snippet saved")};$("#snippetCopy").onclick=()=>copyText($("#snippetBody").value);draw();
}
function gradesApp(){
 openModal("Grade calculator","<p class='subtext'>Enter marks obtained and maximum marks for each subject.</p><div id='gradeRows' class='list'></div><div class='modal-actions'><button class='secondary' id='gradeAdd'>＋ Add subject</button><button class='primary' id='gradeCalc'>Calculate percentage</button></div><div class='panel' style='margin-top:15px'><div class='eyebrow'>TOTAL RESULT</div><div class='timer-number' style='font-size:38px' id='gradeResult'>—</div><p class='subtext' id='gradeDetail'></p></div>");
 const add=()=>{const row=document.createElement("div");row.className="list-item";row.innerHTML="<div class='item-body'><input type='number' min='0' step='any' class='got' placeholder='Marks obtained'><input type='number' min='0.01' step='any' class='max' placeholder='Maximum marks' style='margin-top:7px'></div><button class='icon-btn gradeDel'>×</button>";row.querySelector(".gradeDel").onclick=()=>row.remove();$("#gradeRows").appendChild(row)};
 add();add();$("#gradeAdd").onclick=add;$("#gradeCalc").onclick=()=>{const rows=[...$("#gradeRows").children];let got=0,max=0;for(const r of rows){const a=Number(r.querySelector(".got").value),b=Number(r.querySelector(".max").value);if(!r.querySelector(".got").value&&!r.querySelector(".max").value)continue;if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<=0||a>b){showToast("Check marks: obtained must not exceed maximum");return}got+=a;max+=b}if(!max){showToast("Enter at least one subject");return}$("#gradeResult").textContent=(got/max*100).toFixed(2)+"%";$("#gradeDetail").textContent=`${got} out of ${max} marks`};
}
function toggleTimer(){
 if(timerRunning){clearInterval(timerId);timerId=null;timerRunning=false;paintTimer();return}
 timerRunning=true;timerId=setInterval(()=>{remaining--;if(remaining<=0){remaining=0;clearInterval(timerId);timerId=null;timerRunning=false;state.focusSessions++;state.focusMinutes+=Math.round((Number($("#timerDuration")?.value)||25));saveState();showToast("Focus session complete!");}paintTimer()},1000);paintTimer();
}
function paintTimer(){const num=$("#timerNumber"),toggle=$("#timerToggle"),ring=$("#timerRing");if(num)num.textContent=fmtTime(remaining);if(toggle)toggle.textContent=timerRunning?"Pause":"Start focus";if(ring)ring.classList.toggle("running",timerRunning);const s=$("#focusSessions"),m=$("#focusMinutes");if(s)s.textContent=state.focusSessions;if(m)m.textContent=state.focusMinutes}
function resetTimer(seconds){clearInterval(timerId);timerId=null;timerRunning=false;remaining=seconds;paintTimer()}
function copyText(text){
 if(!text){showToast("Nothing to copy");return}
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>showToast("Copied to clipboard")).catch(()=>fallbackCopy(text))}
 else fallbackCopy(text);
}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");showToast("Copied to clipboard")}catch(e){showToast("Copy unavailable — select and copy manually")}ta.remove()}
function downloadText(name,text,type="application/json"){
 const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportBackup(){
 const payload={app:"VYBE OS",version:3,exportedAt:new Date().toISOString(),state};
 downloadText("vybe-os-backup-"+today()+".json",JSON.stringify(payload,null,2));
 showToast("Backup export started");
}
$("#exportTop").addEventListener("click",exportBackup);
$("#importFile").addEventListener("change",async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  const parsed=JSON.parse(await file.text());const raw=parsed.state||parsed;
  if(!raw||typeof raw!=="object"||Array.isArray(raw))throw new Error("Backup format not recognized");
  if(!confirm("Importing replaces your current workspace data. Export a backup first if you want to keep it. Continue?"))return;
  state=normalize(raw);saveState();resetTimer(Number(state.timerSeconds)||25*60);setPage("overview");showToast("Backup imported");
 }catch(err){showToast("Import failed: "+err.message)}finally{e.target.value=""}
});
function clearData(){
 if(!confirm("This permanently clears VYBE data saved in this browser. Export a backup first if you need one. Continue?"))return;
 if(!confirm("Final confirmation: clear all tasks, notes, projects and custom apps?"))return;
 clearInterval(timerId);timerId=null;timerRunning=false;state=defaultState();remaining=25*60;saveState();setPage("overview");showToast("Workspace cleared");
}
function openSearch(){
 openModal("Search workspace","<label>Search tasks, notes and projects</label><input id='globalQuery' placeholder='Type to search...' autofocus><div id='globalResults' class='list' style='margin-top:14px'></div>","QUICK SEARCH");
 const q=$("#globalQuery"),results=$("#globalResults");
 const draw=()=>{const s=q.value.toLowerCase().trim();if(!s){results.innerHTML="<p class='subtext'>Start typing to search your saved items.</p>";return}
 const items=[...state.tasks.map(x=>({type:"Task",title:x.title,body:x.due||"",page:"tasks"})),...state.notes.map(x=>({type:"Note",title:x.title,body:x.body,page:"notes"})),...state.projects.map(x=>({type:"Project",title:x.title,body:x.description,page:"projects"}))].filter(x=>(x.title+" "+x.body).toLowerCase().includes(s)).slice(0,20);
 results.innerHTML=items.length?items.map(x=>`<button class="list-item" data-search-page="${x.page}" style="text-align:left;color:inherit;width:100%"><div class="item-body"><strong>${esc(x.title)}</strong><p>${x.type} · ${esc(x.body.slice(0,100))}</p></div><span>↗</span></button>`).join(""):"<p class='subtext'>No matching saved items.</p>";
 results.querySelectorAll("[data-search-page]").forEach(b=>b.onclick=()=>{const p=b.dataset.searchPage;closeModal();setPage(p)});
 };q.addEventListener("input",draw);draw();setTimeout(()=>q.focus(),50);
}
$("#globalSearchBtn").addEventListener("click",openSearch);
window.addEventListener("storage",e=>{if(e.key===STORE_KEY&&e.newValue){try{state=normalize(JSON.parse(e.newValue));render();showToast("Workspace synced from another tab")}catch(err){}}});
setTheme();render();
})();
</script>
